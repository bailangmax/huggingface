<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博国风 - 虚构美学展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b10;
            color: #f0f0f5;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景流光与霓虹光效 */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 0, 128, 0.25) 0%, rgba(0, 243, 255, 0.05) 60%, transparent 100%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: blur(80px);
        }

        /* 主容器：毛玻璃卡片 */
        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 420px;
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(0, 243, 255, 0.1);
            text-align: center;
        }

        /* 顶部标签 */
        .tag {
            display: inline-block;
            font-size: 12px;
            letter-spacing: 2px;
            color: #00f3ff;
            background: rgba(0, 243, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        /* 标题 */
        h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 30%, #ff0080 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 副标题与描述 */
        .description {
            font-size: 14px;
            color: #a0a0b0;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* 风格标签展示框 */
        .features {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 0;
        }

        .feature-item span {
            display: block;
        }

        .feature-title {
            font-size: 12px;
            color: #ff0080;
            margin-bottom: 4px;
        }

        .feature-desc {
            font-size: 13px;
            color: #fff;
        }

        /* 交互按钮 */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff0080 0%, #7928ca 100%);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 128, 0.4);
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 128, 0.6);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="tag">CYBER - ORIENTAL</div>
        <h1>赛博国风美学</h1>
        <p class="description">
            当传统东方古典元素与现代先锋设计碰撞，交织出兼具未来科技感与东方韵味的独特视觉张力。
        </p>

        <div class="features">
            <div class="feature-item">
                <span class="feature-title">风格基调</span>
                <span class="feature-desc">国潮解构</span>
            </div>
            <div class="feature-item">
                <span class="feature-title">视觉张力</span>
                <span class="feature-desc">暗黑霓虹</span>
            </div>
            <div class="feature-item">
                <span class="feature-title">材质工艺</span>
                <span class="feature-desc">现代反差</span>
            </div>
        </div>

        <a href="#" class="btn" onclick="alert('感谢浏览赛博国风美学展示！'); return false;">探索更多概念</a>
    </div>

</body>
</html>
